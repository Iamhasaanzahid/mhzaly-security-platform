[client]
showErrorDetails = false
toolbarMode = "minimal"

[logger]
level = "info"

[theme]
primaryColor = "#FF6B35"
backgroundColor = "#0D1117"
secondaryBackgroundColor = "#1C2128"
textColor = "#E6EDF3"
font = "monospace"

[server]
maxUploadSize = 200
enableXsrfProtection = true
enableCORS = false
